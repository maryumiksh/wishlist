<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Abrar's Gift Wishlist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#0f1220; --card:#10217e; --muted:#9aa4b2; --text:#e8ecf1; --accent:#7c5cff; --accent-2:#22c55e; --danger:#ef4444;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#0d1020,#12162a 40%,#0d1020);color:var(--text);}
    header{padding:28px 18px;text-align:center}
    header h1{margin:0;font-size:clamp(24px,4vw,36px)}
    header p{margin:.35rem 0 0;color:var(--muted)}
    .container{max-width:1050px;margin:0 auto;padding:20px}
    .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));}
    .card{background:radial-gradient(120% 120% at 10% 0%,#1b1f36 0%,#12162a 60%);border:1px solid #23273d;border-radius:18px;overflow:hidden;position:relative;box-shadow:0 10px 30px rgba(0,0,0,.25)}
    .thumb{width:100%;height:180px;background:#0b1020;border-bottom:1px solid #23273d}
    .thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .content{padding:14px 14px 16px}
    .title{font-weight:700;font-size:18px;line-height:1.35;margin:0 0 8px}
    .desc{color:var(--muted);font-size:14px;line-height:1.45;margin:0 0 12px}
    .actions{display:flex;gap:8px;flex-wrap:wrap}
    .btn{cursor:pointer;border:0;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
    .reserve{background:var(--accent);color:white}
    .link{background:#26304a;color:#dfe6f3}
    .reserved-badge{position:absolute;top:10px;left:10px;background:linear-gradient(135deg,#1e293b,#111827);color:#cbd5e1;border:1px solid #334155;padding:6px 8px;border-radius:10px;font-size:12px;display:flex;gap:6px;align-items:center}
    .reserved-badge:before{content:"✔";color:var(--accent-2);font-weight:700}
    .footer-note{margin-top:18px;color:var(--muted);font-size:13px;text-align:center}
    dialog{border:1px solid #2a3350;background:#0f1325;color:var(--text);border-radius:16px;padding:0;max-width:420px;width:90vw}
    .dlg-h{padding:14px 16px;border-bottom:1px solid #23273d;font-weight:700}
    .dlg-c{padding:16px}
    .dlg-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 16px;border-top:1px solid #23273d}
    .btn-cancel{background:#26304a;color:#dfe6f3;border:0;border-radius:12px;padding:10px 12px;font-weight:600;font-size:14px}
    .btn-yes{background:var(--accent-2);color:#04110a;border:0;border-radius:12px;padding:10px 12px;font-weight:700;font-size:14px}
    .toast{position:fixed;inset:auto 12px 12px auto;background:#0b1220;color:#e5e7eb;border:1px solid #1f2a44;border-radius:12px;padding:10px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px;display:none}
    .toast.error{border-color:#3b1f2a}
    .topbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:10px auto 0}
    .pill{background:#1a2036;border:1px solid #2a3350;border-radius:999px;padding:8px 12px;font-size:12px;color:#b7c2d5}
  </style>
</head>
<body>
  <header>
    <h1>Abrar's Gift Wishlist</h1>
    <p>Pick a gift you’d like to reserve.</p>
  </header>

  <div class="container">
    <div id="grid" class="grid" aria-live="polite"></div>
    <p class="footer-note">Tip: Share this page link with friends. When a gift is reserved, everyone sees it as “Reserved”.</p>
  </div>

  <!-- Confirm dialog -->
  <dialog id="confirmDlg">
    <div class="dlg-h">Confirm reservation</div>
    <div class="dlg-c">
      <p id="dlgText">Do you really want to reserve this gift?</p>
    </div>
    <div class="dlg-f">
      <button class="btn-cancel" id="btnCancel">Cancel</button>
      <button class="btn-yes" id="btnYes">Yes, reserve</button>
    </div>
  </dialog>

  <div id="toast" class="toast"></div>

  <!-- Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://odvqlptgnpmpipfaegcz.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9kdnFscHRnbnBtcGlwZmFlZ2N6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTg5NzkzMzksImV4cCI6MjA3NDU1NTMzOX0.3-02Ng-2fjhfQnvzA4N2_AY4QAgjMGIiMlfjkjCAY6U";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Local, authoritative list (now with image_url).
    const WISHLIST = [
      {
        id: "sony-wh1000xm5",
        name: "Sony WH-1000XM5 Headphones",
        description: "Noise-canceling wireless headphones with premium sound.",
        product_url: "https://www.sony.com/electronics/headband-headphones/wh-1000xm5",
        image_url: "https://m.media-amazon.com/images/I/61bJX6pG8RL._AC_SL1500_.jpg"
      },
      {
        id: "kindle-paperwhite",
        name: "Kindle Paperwhite 8GB",
        description: "E-reader with adjustable warm light and waterproof design.",
        product_url: "https://www.amazon.com/kindle-paperwhite",
        image_url: "https://m.media-amazon.com/images/I/61tuk2LJ30L._AC_SL1000_.jpg"
      },
      {
        id: "fitbit-charge",
        name: "Fitbit Charge Tracker",
        description: "Fitness tracker with heart-rate monitoring and GPS.",
        product_url: "https://www.fitbit.com/global/us/products/trackers/charge",
        image_url: "https://m.media-amazon.com/images/I/61gI9cYcOZL._AC_SL1500_.jpg"
      },
      {
        id: "lego-architecture",
        name: "LEGO Architecture Set",
        description: "Creative building kit inspired by famous landmarks.",
        product_url: "https://www.lego.com/en-us/themes/architecture",
        image_url: "https://www.lego.com/cdn/cs/set/assets/blt1e6a7a5d9f2b6a3a/21044.jpg"
      },
      {
        id: "arabic-coffee-set",
        name: "Arabic Coffee Set (Dallah)",
        description: "Traditional Arabic dallah set for serving coffee.",
        product_url: "https://example.com/arabic-coffee-set",
        image_url: "https://upload.wikimedia.org/wikipedia/commons/thumb/8/8e/Arabic_coffee_pot.jpg/640px-Arabic_coffee_pot.jpg"
      },
      {
        id: "hourglass-makeup-brushes",
        name: "Hourglass Makeup Brushes",
        description: "Soft, high-quality brushes for precise makeup application.",
        product_url: "https://www.hourglasscosmetics.com/collections/brushes",
        image_url: "https://images.ctfassets.net/4u0n4g9j8kq0/4mV3g1wM7VtGz9WJrU3Wm3/8e5e8c0b1f1e/brushes.jpg"
      }
    ];

    // --- UI helpers ---
    const grid = document.getElementById('grid');
    const toast = document.getElementById('toast');
    const dlg = document.getElementById('confirmDlg');
    const btnCancel = document.getElementById('btnCancel');
    const btnYes = document.getElementById('btnYes');
    const dlgText = document.getElementById('dlgText');
    let pendingGiftId = null;

    function showToast(msg, isError=false){
      toast.textContent = msg;
      toast.classList.toggle('error', !!isError);
      toast.style.display='block';
      setTimeout(()=>{ toast.style.display='none'; }, 3000);
    }

    function escapeHtml(s){
      return s?.replace(/[&<>"']/g, m => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[m])) ?? '';
    }

    function placeholderSVG(){
      // Lightweight inline placeholder (no external request)
      return `data:image/svg+xml;charset=UTF-8,` + encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg" width="800" height="450">
          <defs>
            <linearGradient id="g" x1="0" x2="1" y1="0" y2="1">
              <stop stop-color="#0b1020" offset="0"/><stop stop-color="#141b34" offset="1"/>
            </linearGradient>
          </defs>
          <rect width="100%" height="100%" fill="url(#g)"/>
          <text x="50%" y="52%" dominant-baseline="middle" text-anchor="middle"
                fill="#6b7280" font-family="Inter,Arial" font-size="28">No image</text>
        </svg>`);
    }

    function cardHTML(g){
      const name = escapeHtml(g.name);
      const desc = escapeHtml(g.description || '');
      const url  = g.product_url || '#';
      const img  = g.image_url || placeholderSVG();

      return `
      <div class="card" data-id="${g.id}">
        ${g.reserved ? `<div class="reserved-badge">Reserved</div>` : ''}
        <div class="thumb">
          <img src="${img}" alt="${name}" onerror="this.src='${placeholderSVG()}'" />
        </div>
        <div class="content">
          <div class="title">${name}</div>
          <p class="desc">${desc}</p>
          <div class="actions">
            <a class="btn link" href="${url}" target="_blank" rel="noopener">Open product</a>
            <button class="btn reserve" ${g.reserved ? 'disabled' : ''} data-action="reserve">
              ${g.reserved ? 'Already reserved' : 'Reserve'}
            </button>
          </div>
        </div>
      </div>`;
    }

    function render(list){
      grid.innerHTML = list.map(cardHTML).join('');
      grid.querySelectorAll('[data-action="reserve"]').forEach(btn=>{
        btn.addEventListener('click', (e)=>{
          const card = e.target.closest('.card');
          const id = card.getAttribute('data-id');
          const name = card.querySelector('.title').textContent;
          dlgText.textContent = `Do you really want to reserve “${name}”?`;
          pendingGiftId = id;
          if (typeof dlg.showModal === 'function') dlg.showModal(); else if (confirm(dlgText.textContent)) btnYes.click();
        });
      });
    }

    btnCancel.addEventListener('click', ()=> dlg.close());
    btnYes.addEventListener('click', async ()=>{
      if (!pendingGiftId) return;
      dlg.close();
      await reserveGift(pendingGiftId);
      pendingGiftId = null;
    });

    // --- Data layer (Supabase) ---

    async function ensureRowsExist(){
      // Seed gifts that don’t exist yet
      const rows = WISHLIST.map(g => ({
        id: g.id,
        name: g.name,
        description: g.description || '',
        product_url: g.product_url,
        image_url: g.image_url || null
      }));

      const { error } = await supabase
        .from('gifts')
        .upsert(rows, { onConflict: 'id', ignoreDuplicates: true });

      if (error) console.error('upsert error', error);
    }

    async function fetchGifts(){
      const { data, error } = await supabase
        .from('gifts')
        .select('id,name,description,product_url,image_url,reserved');

      if (error){
        console.error(error);
        showToast('Failed to load gifts', true);
        return [];
      }

      // Local values are authoritative if provided
      const mapLocal = Object.fromEntries(WISHLIST.map(g => [g.id, g]));
      return data.map(row => ({
        id: row.id,
        name: mapLocal[row.id]?.name || row.name,
        description: mapLocal[row.id]?.description ?? row.description ?? '',
        product_url: mapLocal[row.id]?.product_url || row.product_url,
        image_url: mapLocal[row.id]?.image_url || row.image_url,
        reserved: !!row.reserved
      }));
    }

    async function reserveGift(id){
      const { data, error } = await supabase
        .from('gifts')
        .update({ reserved: true, reserved_at: new Date().toISOString() })
        .eq('id', id)
        .eq('reserved', false)
        .select('id,reserved');

      if (error){
        console.error(error);
        showToast('Could not reserve. Try again.', true);
        return;
      }
      if (!data || data.length === 0){
        showToast('Someone just reserved this gift before you.', true);
        await load();
        return;
      }
      showToast('Reserved! Thank you.');
      await load();
    }

    async function load(){
      const list = await fetchGifts();
      render(list);
    }

    (async function init(){
      await ensureRowsExist();
      await load();
      try{
        supabase.channel('realtime-gifts')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'gifts' }, load)
          .subscribe();
      }catch(err){ console.warn('Realtime not available', err); }
    })();
  </script>
</body>
</html>
